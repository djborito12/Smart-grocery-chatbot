<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetailBot | Create employee account</title>
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- REGISTER: hindi naka-link sa login. Buksan nang direkta: register.html -->
  <div class="fx-wrap">
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="nebula" aria-hidden="true"></div>
    <div class="fx-stage">
      <div class="orbits" aria-hidden="true"><i></i><i></i><i></i></div>
      <form id="reg-form" class="fx-card" novalidate>
        <span class="fx-shine" aria-hidden="true"></span>
        <div class="fx-brand"><i>R</i>RetailBot</div>
        <h1>Create<br>account</h1>
        <span class="role-pill">Role: Employee</span>
        <label class="fx-field" for="rg-user"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></svg><input id="rg-user" placeholder="Username (3-20 letters or numbers)" autocomplete="username" maxlength="20" aria-label="Username"></label>
        <label class="fx-field" for="rg-pass"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg><input id="rg-pass" type="password" placeholder="Password (at least 6 characters)" autocomplete="new-password" aria-label="Password"></label>
        <label class="fx-field" for="rg-pass2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg><input id="rg-pass2" type="password" placeholder="Confirm password" autocomplete="new-password" aria-label="Confirm password"></label>
        <button class="fx-btn" type="submit"><span class="fx-btn-text">Create account</span><span class="fx-spin" aria-hidden="true"></span></button>
        <div id="rg-msg" class="fx-error" role="alert"></div>
        <p class="fx-note">Already have an account? <a href="index.html">Sign in</a></p>
        <div class="fx-success" aria-hidden="true"><svg viewBox="0 0 100 100" width="110" height="110"><path d="M22 52 L42 72 L80 30"/></svg></div>
      </form>
      <div class="fx-term"><div class="fx-term-bar"><i></i><i></i><i></i><span>account.log</span></div><div id="fx-log" class="fx-log" aria-live="polite"></div></div>
    </div>
  </div>
  <script src="js/login-fx.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
